<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hajime no Ippo Photo Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0f;
      color: #f7f4ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(158, 39, 39, 0.22), transparent 38rem),
        #0c0c0f;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0 64px;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #e5aa78;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.25rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .subtitle {
      max-width: 560px;
      margin: 16px auto 0;
      color: #aaa6a2;
      font-size: 1rem;
      line-height: 1.6;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .photo {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: #1a1819;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 240ms ease, filter 240ms ease;
    }

    .photo:hover img,
    .photo:focus-within img {
      transform: scale(1.04);
      filter: brightness(1.08);
    }

    footer {
      margin-top: 28px;
      color: #77736f;
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      main { padding-top: 48px; }
      .photo-grid { gap: 8px; }
      .photo { border-radius: 9px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Celebration collection</p>
      <h1>Hajime no Ippo</h1>
      <p class="subtitle">A nine-frame gallery celebrating over 100 million copies sold.</p>
    </header>

    <section class="photo-grid" aria-label="Hajime no Ippo photo gallery">
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 1"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 2"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 3"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 4"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 5"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 6"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 7"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 8"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
      <a class="photo" href="image/hajime-no-ippo-celebration.webp" aria-label="Open photo 9"><img src="image/hajime-no-ippo-celebration.webp" alt="Hajime no Ippo celebration drawing"></a>
    </section>

    <footer>9 equal squares · Hajime no Ippo</footer>
  </main>
</body>
</html>
